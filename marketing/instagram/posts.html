<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>проЯв — каруселі Instagram 1–6</title>
<!--
  Шість каруселей по 3–4 слайди, один шаблон (4:5, 1080×1350):
  заголовок — верхній лівий кут, телефон — по центру, логотип — нижній правий.
  Слайди збираються з масиву POSTS унизу. Фото — реальні зйомки з public/themes.
  Експорт PNG: node marketing/instagram/export.cjs
-->
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 300 900; src: url('../../public/fonts/unbounded-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Unbounded'; font-weight: 300 900; src: url('../../public/fonts/unbounded-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20B4, U+2191, U+2193, U+2212; }
  @font-face { font-family: 'Manrope'; font-weight: 200 800; src: url('../../public/fonts/manrope-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Manrope'; font-weight: 200 800; src: url('../../public/fonts/manrope-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+20B4, U+2191, U+2193, U+2212; }

  :root {
    --bg: #f4f4f1; --fg: #0d0c0a; --muted: #6f6d66;
    --accent: #2f55ff; --accent-deep: #1f3fe0; --accent-soft: #8fa2ff;
    --line: #e5e3dc; --coal: #12110e;
    --radius: 12px;
    --serif: Georgia, 'Liberation Serif', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d8d2; font-family: 'Manrope', sans-serif; color: var(--fg); padding: 40px; }
  .carousel { display: flex; gap: 24px; margin-bottom: 60px; }

  /* ---------- шаблон слайда ---------- */
  .post { position: relative; width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; flex: none; }
  .head { position: absolute; left: 72px; top: 76px; right: 72px; }
  .head h1 { font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 64px; line-height: 1.08;
             letter-spacing: -0.02em; max-width: 936px; }
  .head h1 em { font-style: normal; color: var(--accent); white-space: nowrap; }
  .head p { margin-top: 22px; font-size: 28px; line-height: 1.38; color: var(--muted); font-weight: 500; max-width: 900px; }
  .logo { position: absolute; right: 72px; bottom: 62px; font-family: 'Unbounded', sans-serif;
          font-weight: 600; font-size: 34px; letter-spacing: -0.02em; color: var(--fg); }

  /* ---------- один телефон: фронтально, одна м'яка тінь ---------- */
  .phone { position: absolute; left: 50%; top: 356px; width: 450px; height: 930px; margin-left: -225px;
           background: var(--coal); border-radius: 66px; padding: 11px;
           box-shadow: 0 44px 90px -24px rgba(13, 12, 10, 0.30); }
  .screen { width: 428px; height: 908px; border-radius: 55px; overflow: hidden; background: var(--bg); position: relative; }
  .ui { width: 390px; height: 827px; zoom: 1.0974; position: relative; overflow: hidden; }
  .ui.dark { background: #0a090b; color: #f7f4ee; }
  .island { position: absolute; z-index: 40; top: 10px; left: 50%; margin-left: -56px; width: 112px; height: 32px;
            border-radius: 20px; background: var(--coal); }
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px;
            font-weight: 700; font-size: 15px; position: relative; z-index: 30; }
  .status.light { position: absolute; left: 0; right: 0; top: 0; color: #fff; }
  .status .ic { display: flex; gap: 6px; align-items: center; }
  .sig { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
  .sig i { width: 3px; background: currentColor; border-radius: 1px; }
  .sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 6px; } .sig i:nth-child(3) { height: 8px; } .sig i:nth-child(4) { height: 11px; }
  .bat { width: 24px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: .9; }
  .bat::before { content: ''; display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1.5px; }

  /* слайд з переліком: телефон трохи нижче */
  .tall-head .phone { top: 392px; height: 894px; }
  .tall-head .screen { height: 872px; }
  .tall-head .ui { height: 795px; }
  .list { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 40px; max-width: 936px; }
  .list.three { grid-template-columns: 1fr 1fr 1fr; }
  .list span { font-size: 25px; font-weight: 500; line-height: 1.3; color: var(--fg); padding-left: 22px; position: relative; }
  .list span::before { content: ''; position: absolute; left: 0; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }

  /* ---------- UI галереї (за GalleryExperience.module.css) ---------- */
  .caps { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .ph { background-size: cover; background-position: center; }
  .g-cover { position: relative; margin: 0 8px; height: 262px; border-radius: var(--radius); overflow: hidden; }
  .g-cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.38)); }
  .g-cover .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                    justify-content: center; text-align: center; color: #f7f4ee; padding: 20px; }
  .g-cover .caps, .full .caps { color: rgba(247,244,238,.88); }
  .g-title { font-family: var(--serif); font-weight: 400; font-size: 31px; line-height: 1.1; margin-top: 12px;
             text-shadow: 0 2px 40px rgba(0,0,0,.45); }
  .full { position: absolute; inset: 0; }
  .low-title .full .inner { bottom: 22px; }
  .full .inner { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; color: #f7f4ee; }
  .mark { font-weight: 800; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; }
  .g-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: relative; z-index: 25; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
          padding: 6px 11px; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip svg { width: 12px; height: 12px; }
  .lang { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; position: relative; }
  .lang > svg { width: 10px; height: 7px; }
  .dl { margin-left: auto; border-radius: 999px; background: var(--accent); color: #fff; padding: 10px 15px;
        font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px; }
  .shot { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; }
  .shot.tall { aspect-ratio: 3 / 4; }
  .shot.wide { grid-column: span 2; aspect-ratio: 16 / 9; }
  .heart { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; color: var(--fg);
           background: rgba(244,244,241,.92); display: grid; place-items: center; box-shadow: 0 3px 12px rgba(0,0,0,.16); }
  .heart svg { width: 14px; height: 14px; }
  .heart.on { color: var(--accent); }
  .play { position: absolute; top: 50%; left: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
          background: rgba(0,0,0,.45); display: grid; place-items: center; }
  .play::before { content: ''; margin-left: 4px; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
  .dur { position: absolute; left: 10px; bottom: 10px; color: #fff; font-size: 11px; font-weight: 700;
         letter-spacing: .06em; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .menu { position: absolute; top: 26px; left: -14px; z-index: 30; width: 124px; background: #fff; border: 1px solid var(--line);
          border-radius: var(--radius); padding: 4px 0; box-shadow: 0 12px 32px rgba(0,0,0,.12); }
  .menu span { display: block; padding: 7px 16px; font-size: 13.5px; font-weight: 500; color: var(--fg); }
  .menu span.cur { font-weight: 700; color: var(--accent); }
  .foot { text-align: center; padding: 18px 0 0; }
  .sig-name { font-family: var(--serif); font-size: 20px; }

  /* лайтбокс */
  .lb-media { position: absolute; left: 0; right: 0; top: 250px; height: 219px; }
  .lb-ctrl { position: absolute; left: 14px; right: 14px; top: 486px; display: flex; align-items: center; gap: 10px; font-size: 11.5px; font-weight: 700; color: rgba(247,244,238,.8); }
  .lb-ctrl .track { flex: 1; height: 4px; border-radius: 4px; background: rgba(247,244,238,.2); }
  .lb-ctrl .track i { display: block; width: 34%; height: 100%; border-radius: 4px; background: #f7f4ee; }
  .lb-tools { position: absolute; top: 64px; right: 18px; display: flex; gap: 10px; }
  .lb-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(250,249,247,.1); display: grid; place-items: center; font-size: 16px; }
  .lb-foot { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lb-dl { border-radius: 999px; background: #f7f4ee; color: #17161a; padding: 12px 24px; font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

  /* ---------- UI кабінету ---------- */
  .dash { padding: 4px 18px 0; }
  .dash h2 { font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; }
  .h3 { font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; line-height: 1.45; }
  .btn-o { display: inline-flex; justify-content: center; border: 1px solid var(--fg); border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 700; }
  .btn-o.a { border-color: var(--accent); color: var(--accent); }
  .btn-a { display: flex; justify-content: center; border-radius: 999px; padding: 13px 16px; font-size: 13px; font-weight: 800; background: var(--accent); color: #fff; }
  .btn-w { display: flex; justify-content: center; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 12px 16px; font-size: 13px; font-weight: 700; }
  .meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .card.sel { border-color: var(--accent); }
  .gcard { margin-top: 12px; overflow: hidden; }
  .gcard .ph { height: 150px; }
  .gcard .meta { padding: 10px 12px 12px; }
  .gcard b { display: block; font-size: 14px; font-weight: 700; }
  .ggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .ggrid .gcard { margin: 0; }
  .ggrid .gcard .ph { height: 128px; }
  .ggrid .gcard b { font-size: 12.5px; line-height: 1.3; margin-bottom: 4px; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .tile { padding: 11px 10px; }
  .tile p { font-size: 8.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile strong { display: block; margin-top: 6px; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 22px; }
  .fav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .fav .shot { aspect-ratio: 1; border-radius: 8px; }
  .fav .heart { width: 22px; height: 22px; top: 5px; right: 5px; }
  .fav .heart svg { width: 11px; height: 11px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .between { justify-content: space-between; }
  .field { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .label { font-size: 12.5px; color: var(--muted); margin: 14px 0 6px; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-top: 16px; }
  .tabs span { flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .tabs span.on { background: var(--fg); color: var(--bg); }
  .plan { padding: 12px 14px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
  .plan b { font-size: 14px; }
  .plan .price { font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 16px; }
  /* ---------- варіанти макета (заголовок і логотип завжди на своїх місцях) ---------- */
  /* «фото»: велике фото замість телефона + справжній елемент інтерфейсу поверх */
  .big { position: absolute; left: 72px; right: 72px; top: 356px; bottom: 124px; border-radius: var(--radius); overflow: hidden; }
  .tall-head .big { top: 400px; }
  .big .ph { position: absolute; inset: 0; }
  .big .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,0) 40%, rgba(0,0,0,.42)); }
  .ov { position: absolute; zoom: 1.6; }
  .ov-title { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; color: #f7f4ee; }
  .ov-title .g-title { font-size: 58px; }
  .ov-title .caps { font-size: 15px; color: rgba(247,244,238,.88); }
  /* «збоку»: текст ліворуч, телефон праворуч */
  .L-side .head { right: 548px; }
  .L-side .head h1 { font-size: 50px; }
  .L-side .head h1 em { white-space: normal; }
  .L-side .head p { font-size: 26px; }
  .L-side .phone { left: auto; right: 72px; margin: 0; top: 290px; height: 920px; }
  .L-side .screen { height: 898px; }
  .L-side .ui { height: 818px; }
  .stat { position: absolute; left: 72px; bottom: 150px; width: 440px; }
  .stat b { display: block; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 116px; line-height: 1; letter-spacing: -0.03em; }
  .stat span { display: block; margin-top: 14px; font-size: 24px; line-height: 1.35; color: var(--muted); }
  /* «крупно»: телефон збільшений і обрізаний низом кадру */
  .L-zoom .phone { transform: scale(1.42); transform-origin: 50% 0; top: 372px; margin-left: -272px; }
  /* «темний» (≤20 % слайдів): вугільний фон */
  .L-dark { background: var(--coal); }
  .L-dark .head h1, .L-dark .logo, .L-dark .list span { color: var(--bg); }
  .L-dark .head h1 em { color: var(--accent-soft); }
  .L-dark .head p { color: rgba(244,244,241,.62); }
  .L-dark .list span::before { background: var(--bg); }
  .L-dark .phone { box-shadow: 0 0 0 2px rgba(244,244,241,.14), 0 44px 90px -24px rgba(0,0,0,.6); }
  .files { font-family: 'DejaVu Sans Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 1.75; padding: 10px 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// 's01' → public/showcase/01.jpg, '07' → public/themes/07.jpg
const T = n => n[0] === 's' ? `../../public/showcase/${n.slice(1)}.jpg` : `../../public/themes/${n}.jpg`
const HEART = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.7 1.3 5.2 3 1.5-1.7 3-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>'
const CHEV = up => `<svg viewBox="0 0 10 6" ${up ? 'style="transform:rotate(180deg)"' : ''}><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`
// кадрування облич для конкретних фото
const FOCUS = { '40': '50% 30%', '41': '50% 25%', '43': '50% 25%', '47': '50% 25%', '48': '50% 25%', '49': '50% 30%', '42': '50% 25%', '44': '50% 25%', '45': '50% 25%', '46': '50% 25%', '25': '50% 45%', '26': '50% 50%', 's11': '50% 60%', 's01': '50% 60%', 's03': '55% 45%', 's04': '55% 40%', 's14': '50% 35%', 's09': '50% 30%', '27': '50% 40%', '28': '45% 35%', '29': '50% 40%', '07': '55% 35%', '18': '50% 30%', '16': '50% 40%', '21': '50% 55%', '15': '52% 40%', '01': '50% 45%' }
const bg = n => `background-image:url('${T(n)}');background-position:${FOCUS[n] || '50% 50%'}`

const status = light => `<div class="status ${light ? 'light' : ''}"><span>9:41</span><span class="ic"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="bat"></span></span></div>`
const cover = (n, caps, title) => `<div class="g-cover"><div class="ph" style="position:absolute;inset:0;${bg(n)}"></div><div class="shade"></div>
  <div class="inner"><span class="caps">${caps}</span><div class="g-title">${title}</div></div></div>`
const fullCover = (n, caps, title, hint = 'гортайте ↓', extra = '') => `<div class="full"><div class="ph" style="position:absolute;inset:0;${bg(n)}"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.06) 45%,rgba(0,0,0,.5))"></div>${extra}
  <div class="inner"><span class="caps">${caps}</span><div class="g-title" style="font-size:36px">${title}</div>
  ${hint ? `<span class="caps" style="display:block;margin-top:22px">${hint}</span>` : ''}</div></div>`
const bar = ({ sel = '12 обрано', on = false, lang = 'UA', dl = 'Завантажити все', menu = '' } = {}) => `<div class="g-bar">
  <span class="chip ${on ? 'on' : ''}">${HEART}${sel}</span>
  <span class="lang">${lang} ${CHEV(!!menu)}${menu}</span>
  <span class="dl">${dl}</span></div>`
const shot = (n, { cls = '', heart = false, play = '' } = {}) => `<div class="shot ${cls} ph" style="${bg(n)}">${heart ? `<span class="heart ${heart === 'on' ? 'on' : ''}">${HEART}</span>` : ''}${play ? `<span class="play"></span><span class="dur">${play}</span>` : ''}</div>`
const grid = items => `<div class="grid">${items.map(i => typeof i === 'string' ? shot(i) : shot(i.n, i)).join('')}</div>`
const favs = (ns, heart = true) => `<div class="fav">${ns.map(n => shot(n, { heart: heart && 'on' })).join('')}</div>`
const langMenu = cur => `<span class="menu">${['UA', 'EN', 'PL', 'DE', 'ES', 'FR', 'IT', 'RO', 'PT'].map(l => `<span class="${l === cur ? 'cur' : ''}">${l}</span>`).join('')}</span>`
const gcard = (n, title, meta) => `<div class="card gcard"><div class="ph" style="${bg(n)}"></div><div class="meta"><b>${title}</b><span class="small muted">${meta}</span></div></div>`
const pub = '<span class="pill">Опубліковано</span>'
const storage = (used, of, plan, pct) => `<div class="card" style="padding:13px 14px;margin-top:14px">
  <div class="row between"><span class="small muted">Використано сховища</span><span class="pill">${plan}</span></div>
  <div style="font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;margin:6px 0 10px">${used} <span class="muted" style="font-size:14px">з ${of}</span></div>
  <div class="meter"><i style="width:${pct}%"></i></div></div>`

const GALLERIES_MOUNTAIN = [['07', 'Весілля Олі та Максима'], ['21', 'Весілля Ірини та Тараса'], ['13', 'Заручини Каті та Олега'],
  ['19', 'Лав-сторі Ані та Дмитра'], ['05', 'Весілля Софії та Назара'], ['22', 'Прогулянка після розпису', true]]
// пост 2: кабінет фотографа з різними клієнтами
const GALLERIES_MIXED = [['s03', 'Весілля Марії та Андрія'], ['28', 'Весілля Юлі та Романа'], ['s04', 'Сімейна зйомка Коваленків'],
  ['s14', 'Лав-сторі Лесі та Івана'], ['s09', 'Родина Мельників'], ['s01', 'Прогулянка в лісі', true]]

/* ---------- екрани телефона (за реальним UI кабінету й галереї) ---------- */
const S = {
  gallery: () => status() + cover('07', 'Серпень 2026', 'Весілля Олі<br>та Максима') + bar() +
    grid(['15', { n: '18', heart: 'on' }, '01', '16', '12', '03']),

  galleries: (used, of, plan, pct, cards = GALLERIES_MOUNTAIN) => status() + `<div class="dash">
    <div class="row between" style="margin-top:6px"><h2>Мої галереї</h2><span class="btn-o">Нова галерея</span></div>
    ${storage(used, of, plan, pct)}

  let media
  if (sl.layout === 'photo') {
    media = `<div class="big"><div class="ph" style="${bg(sl.photo)}"></div>${sl.ov || ''}</div>`

    const inner = sl.s()

  }
  const cls = [list && 'tall-head', sl.layout && `L-${sl.layout}`, sl.dark && 'L-dark'].filter(Boolean).join(' ')
