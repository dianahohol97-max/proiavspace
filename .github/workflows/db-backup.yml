name: DB — nightly backup to B2

# Supabase Free keeps no backups at all (audit BK-01). Every night: pg_dump of
# the public + auth schemas (custom format, compressed) → a SEPARATE B2 bucket
# under the db/ prefix (never the media bucket), then a restore check: the
# dump is restored into a throwaway Postgres in this job and a few row counts
# are compared with production. A dump that cannot be restored fails the
# workflow, so a broken backup never sits unnoticed for months.
# Only the newest 14 dumps are kept (older ones are deleted after a
# successful upload). How to restore: docs/DB_BACKUP_RESTORE.md.
#
# Without the SUPABASE_DB_URL secret the run is SKIPPED (green, with a
# warning), not failed — e.g. on forks or before the secrets are set.
# With SUPABASE_DB_URL but without the B2 secrets it fails: a half-configured
# backup must be visible.
#
# Repository secrets:
#   SUPABASE_DB_URL          — Supabase → Connect → Session pooler URI (IPv4 works
#                              from GitHub runners; direct db.* host is IPv6-only)
#   B2_BACKUP_KEY_ID / B2_BACKUP_APPLICATION_KEY — a B2 key scoped to the backup
#                              bucket only (listFiles, readFiles, writeFiles,
#                              deleteFiles — delete is needed to keep 14 copies)
#   B2_BACKUP_BUCKET         — e.g. proiav-db-backups
#   B2_BACKUP_REGION         — e.g. eu-central-003

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC daily (04:17/05:17 Kyiv)
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  KEEP: '14'
  PREFIX: db/

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$HAS_DB_URL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=DB backup skipped::SUPABASE_DB_URL secret is not set — no backup was made."
          fi

  backup:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.B2_BACKUP_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      B2_ENDPOINT: https://s3.${{ secrets.B2_BACKUP_REGION }}.backblazeb2.com
      BUCKET: ${{ secrets.B2_BACKUP_BUCKET }}
      RESTORE_URL: postgres://postgres:restore@localhost:5432/restore_check
    steps:
      - name: Check the B2 secrets
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=DB backup misconfigured::SUPABASE_DB_URL is set but B2 secrets are missing:$missing (B2_BACKUP_KEY_ID / B2_BACKUP_APPLICATION_KEY / B2_BACKUP_REGION / B2_BACKUP_BUCKET)"
            exit 1
          fi

      - name: Install Postgres 17 client (matches the Supabase server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --compress=6 --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file "proiav-$STAMP.dump"
          ls -l "proiav-$STAMP.dump"
          # Row counts of the tables that matter, compared after the restore.
          psql "$SUPABASE_DB_URL" -At -c \
            "select 'profiles',count(*) from public.profiles union all
             select 'galleries',count(*) from public.galleries union all
             select 'assets',count(*) from public.assets union all
             select 'payments',count(*) from public.payments union all
             select 'auth_users',count(*) from auth.users order by 1" > counts.prod
          cat counts.prod

      - name: Restore check (throwaway Postgres)
        run: |
          set -euo pipefail
          psql postgres://postgres:restore@localhost:5432/postgres -q -c "create database restore_check"
          # The auth schema references Supabase-only roles/extensions; those
          # objects are skipped (exit code 1 = warnings), tables still restore.
          /usr/lib/postgresql/17/bin/pg_restore --dbname "$RESTORE_URL" \
            --no-owner --no-privileges --jobs 2 "proiav-$STAMP.dump" || true
          psql "$RESTORE_URL" -At -c \
            "select 'profiles',count(*) from public.profiles union all
             select 'galleries',count(*) from public.galleries union all
             select 'assets',count(*) from public.assets union all
             select 'payments',count(*) from public.payments union all
             select 'auth_users',count(*) from auth.users order by 1" > counts.restored
          echo "--- production"; cat counts.prod
          echo "--- restored";  cat counts.restored
          diff counts.prod counts.restored

      - name: Upload to B2
        run: |
          set -euo pipefail
          aws --endpoint-url "$B2_ENDPOINT" s3 cp "proiav-$STAMP.dump" \
            "s3://$BUCKET/${PREFIX}proiav-$STAMP.dump" --no-progress

      - name: Verify the upload
        run: |
          set -euo pipefail
          LOCAL=$(stat -c %s "proiav-$STAMP.dump")
          REMOTE=$(aws --endpoint-url "$B2_ENDPOINT" s3api head-object \
            --bucket "$BUCKET" --key "${PREFIX}proiav-$STAMP.dump" --query ContentLength --output text)
          echo "local=$LOCAL remote=$REMOTE"
          test "$LOCAL" = "$REMOTE"

      - name: Keep only the newest 14 dumps (KEEP)
        run: |
          set -euo pipefail
          # Names carry a UTC timestamp, so lexical order = age order.
          aws --endpoint-url "$B2_ENDPOINT" s3api list-objects-v2 \
            --bucket "$BUCKET" --prefix "${PREFIX}proiav-" \
            --query 'Contents[].Key' --output text | tr '\t' '\n' \
            | grep -E "^${PREFIX}proiav-.*\.dump$" | sort > keys.txt || true
          echo "dumps in the bucket: $(wc -l < keys.txt)"
          # Never prune unless today's dump is in the listing.
          grep -qx "${PREFIX}proiav-$STAMP.dump" keys.txt
          head -n -"$KEEP" keys.txt > delete.txt
          if [ ! -s delete.txt ]; then echo "nothing to delete"; exit 0; fi
          while read -r key; do
            echo "delete $key"
            # Object Lock still on a version → B2 refuses; warn, retry tomorrow.
            aws --endpoint-url "$B2_ENDPOINT" s3 rm "s3://$BUCKET/$key" \
              || echo "::warning::could not delete $key (Object Lock?) — will retry next run"
          done < delete.txt
          aws --endpoint-url "$B2_ENDPOINT" s3 ls "s3://$BUCKET/$PREFIX" | tail -n "$KEEP"
