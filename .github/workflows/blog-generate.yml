name: Blog — generate article

# Content engine: twice a week (~8/month) writes the next queued topic into a
# DRAFT article in the database. Review and publish it in the dashboard
# (Дашборд → Блог). Nothing goes live automatically.
#
# Requires repo secrets: GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 8 * * 1,4' # Mon & Thu, 08:00 UTC (~10:00–11:00 Kyiv)
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write the next article (as a draft)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-article.mjs
